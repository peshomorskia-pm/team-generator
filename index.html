<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор на отбори</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 py-8 px-4 sm:px-6 lg:px-8 flex flex-col items-center justify-start">

    <main class="w-full max-w-3xl bg-white rounded-2xl shadow-xl overflow-hidden transition-all">
        <!-- Header -->
        <div class="bg-indigo-600 px-6 py-8 sm:p-10 text-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Генератор на Отбори 🎲</h1>
            <p class="mt-2 text-indigo-100 text-sm sm:text-base">Въведете списък с играчи и ги разпределете на случаен принцип.</p>
        </div>

        <!-- Form Content -->
        <div class="px-6 py-8 sm:p-10">
            <!-- Custom Message Box for Errors -->
            <div id="messageBox" class="hidden mb-6 p-4 rounded-lg flex border" role="alert">
                <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                </svg>
                <span id="messageText" class="text-sm font-medium"></span>
            </div>

            <div class="space-y-6">
                <!-- Players Input -->
                <div>
                    <label for="playersList" class="block text-sm font-semibold text-gray-700 mb-2">
                        Списък с играчи
                    </label>
                    <textarea id="playersList" rows="6" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors resize-y text-sm sm:text-base"
                        placeholder="Въведете по едно име на ред...&#10;Пример:&#10;Иван&#10;Петър&#10;Георги&#10;...или просто въведете числа от 1 до 10"></textarea>
                    <p class="mt-2 text-xs text-gray-500 flex justify-between">
                        <span>Всеки нов ред е отделен играч.</span>
                        <span id="playerCountLabel">0 въведени</span>
                    </p>
                </div>

                <!-- Settings Inputs -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="numTeams" class="block text-sm font-semibold text-gray-700 mb-2">
                            Брой отбори
                        </label>
                        <input type="number" id="numTeams" min="1"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                            placeholder="Напр. 2">
                    </div>
                    <div>
                        <label for="playersPerTeam" class="block text-sm font-semibold text-gray-700 mb-2">
                            <span class="opacity-80 font-normal mr-1">(или)</span> Брой играчи в отбор
                        </label>
                        <input type="number" id="playersPerTeam" min="1"
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                            placeholder="Напр. 5">
                    </div>
                </div>

                <!-- Generate Button -->
                <button id="generateBtn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-xl shadow-md hover:shadow-lg transform transition-all active:scale-95 flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                    </svg>
                    <span>Разпредели в отбори</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Results Container -->
    <div id="resultsContainer" class="w-full max-w-5xl mt-10 hidden">
        <div class="flex items-center justify-between mb-6 px-2">
            <h2 class="text-2xl font-bold text-gray-800">Резултати</h2>
            <button id="copyBtn" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium flex items-center bg-white px-3 py-1.5 rounded-lg shadow-sm border border-gray-200 transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Копирай
            </button>
        </div>
        <div id="teamsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Teams will be injected here via JS -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playersListInput = document.getElementById('playersList');
            const numTeamsInput = document.getElementById('numTeams');
            const playersPerTeamInput = document.getElementById('playersPerTeam');
            const generateBtn = document.getElementById('generateBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const teamsGrid = document.getElementById('teamsGrid');
            const playerCountLabel = document.getElementById('playerCountLabel');
            const messageBox = document.getElementById('messageBox');
            const messageText = document.getElementById('messageText');
            const copyBtn = document.getElementById('copyBtn');

            // --- Helper Functions ---

            // Update player count based on textarea lines
            const updatePlayerCount = () => {
                const count = getPlayers().length;
                playerCountLabel.textContent = `${count} въведени`;
                if(count > 0) {
                    playerCountLabel.classList.add('text-indigo-600', 'font-semibold');
                    playerCountLabel.classList.remove('text-gray-500');
                } else {
                    playerCountLabel.classList.add('text-gray-500');
                    playerCountLabel.classList.remove('text-indigo-600', 'font-semibold');
                }
            };

            playersListInput.addEventListener('input', updatePlayerCount);

            // Get cleaned array of players
            const getPlayers = () => {
                const text = playersListInput.value;
                return text.split('\n')
                           .map(player => player.trim())
                           .filter(player => player.length > 0);
            };

            // Fisher-Yates Shuffle Algorithm
            const shuffleArray = (array) => {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            };

            // Show Custom Message (Success/Error)
            const showMessage = (msg, isError = true) => {
                messageText.textContent = msg;
                messageBox.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border-red-200', 'bg-green-50', 'text-green-800', 'border-green-200');
                
                if (isError) {
                    messageBox.classList.add('bg-red-50', 'text-red-800', 'border-red-200');
                } else {
                    messageBox.classList.add('bg-green-50', 'text-green-800', 'border-green-200');
                }
                
                // Auto hide after 4 seconds
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 4000);
            };

            // Clear previous results
            const clearResults = () => {
                teamsGrid.innerHTML = '';
                resultsContainer.classList.add('hidden');
            };

            // State memory for anti-repetition
            let lastGeneratedTeamsFingerprint = "";

            // Helper to generate a fingerprint for a team configuration
            const getTeamsFingerprint = (teams) => {
                // Сортираме играчите във всеки отбор, след което сортираме самите отбори
                // по първия им играч. Така независимo от поредността на генериране, 
                // еднаквите отбори ще имат абсолютно еднакъв текстов отпечатък.
                const normalizedTeams = teams.map(team => [...team].sort()).sort((a, b) => {
                    if (!a[0]) return 1;
                    if (!b[0]) return -1;
                    return a[0].localeCompare(b[0]);
                });
                return JSON.stringify(normalizedTeams);
            };

            // --- Main Logic ---

            generateBtn.addEventListener('click', () => {
                clearResults();
                const players = getPlayers();
                const numTeams = parseInt(numTeamsInput.value, 10);
                const playersPerTeam = parseInt(playersPerTeamInput.value, 10);

                // Validations
                if (players.length === 0) {
                    showMessage("Списъкът с играчи е празен. Моля, въведете поне няколко имена.");
                    return;
                }
                if (players.length < 2) {
                    showMessage("Нужни са поне 2-ма играчи за да се сформират отбори.");
                    return;
                }
                if (isNaN(numTeams) && isNaN(playersPerTeam)) {
                    showMessage("Моля, въведете 'Брой отбори' или 'Брой играчи в отбор'.");
                    return;
                }

                let teams = [];
                let attempts = 0;
                let currentFingerprint = "";
                const maxAttempts = 15; // Предпазител срещу безкраен цикъл, ако има само 1 възможна конфигурация

                // Генерираме отбори (Fisher-Yates) докато не получим различни от предишните 
                // или докато не достигнем лимита от опити (maxAttempts).
                do {
                    const shuffledPlayers = shuffleArray(players);
                    teams = [];

                    /* 
                     * Distribution Logic:
                     * 1. If 'numTeams' is provided, we prioritize it. We use Round-Robin to ensure even distribution.
                     * 2. If only 'playersPerTeam' is provided, we slice the array into chunks.
                     */
                    if (!isNaN(numTeams) && numTeams > 0) {
                        if (numTeams > players.length) {
                             showMessage("Броят на отборите не може да е по-голям от броя на играчите.");
                             return;
                        }
                        // Initialize empty teams
                        for (let i = 0; i < numTeams; i++) {
                            teams.push([]);
                        }
                        // Round-robin distribution
                        shuffledPlayers.forEach((player, index) => {
                            teams[index % numTeams].push(player);
                        });
                    } else if (!isNaN(playersPerTeam) && playersPerTeam > 0) {
                        // Chunk distribution
                        for (let i = 0; i < shuffledPlayers.length; i += playersPerTeam) {
                            teams.push(shuffledPlayers.slice(i, i + playersPerTeam));
                        }
                    } else {
                        showMessage("Моля, въведете валидно положително число за отборите.");
                        return;
                    }

                    currentFingerprint = getTeamsFingerprint(teams);
                    attempts++;
                } while (currentFingerprint === lastGeneratedTeamsFingerprint && attempts < maxAttempts);

                // Запазваме отпечатъка за следващото генериране
                lastGeneratedTeamsFingerprint = currentFingerprint;

                // --- Render Teams ---
                
                // Add staggered animation effect variables
                let delay = 0;

                teams.forEach((team, index) => {
                    // Card creation
                    const card = document.createElement('div');
                    // Styling the card with Tailwind
                    card.className = `bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden transform transition-all duration-500 opacity-0 translate-y-4 hover:shadow-md`;
                    card.style.animationDelay = `${delay}ms`;
                    
                    // Card Header
                    const header = document.createElement('div');
                    header.className = 'bg-gradient-to-r from-gray-50 to-gray-100 px-5 py-3 border-b border-gray-100 flex justify-between items-center';
                    header.innerHTML = `
                        <h3 class="font-bold text-gray-800 flex items-center">
                            <span class="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2">${index + 1}</span>
                            Отбор ${index + 1}
                        </h3>
                        <span class="text-xs font-medium text-gray-500 bg-white px-2 py-1 rounded-full border border-gray-200">${team.length} играчи</span>
                    `;
                    
                    // Card Body (Players List)
                    const body = document.createElement('div');
                    body.className = 'p-5';
                    const ul = document.createElement('ul');
                    ul.className = 'space-y-2';
                    
                    team.forEach((player) => {
                        const li = document.createElement('li');
                        li.className = 'flex items-center text-gray-700';
                        li.innerHTML = `<svg class="w-4 h-4 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> <span class="break-words w-full">${player}</span>`;
                        ul.appendChild(li);
                    });

                    body.appendChild(ul);
                    card.appendChild(header);
                    card.appendChild(body);
                    teamsGrid.appendChild(card);

                    // Fade-in animation trigger via Timeout to allow DOM paint
                    setTimeout(() => {
                        card.classList.remove('opacity-0', 'translate-y-4');
                    }, 50 + delay);
                    
                    delay += 100; // Increment delay for next card
                });

                resultsContainer.classList.remove('hidden');
                
                // Scroll smoothly to results
                setTimeout(() => {
                    resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            });

            // --- Copy functionality ---
            copyBtn.addEventListener('click', () => {
                const teamsCards = teamsGrid.children;
                if(teamsCards.length === 0) return;

                let textToCopy = "Списък с отбори:\n\n";
                
                Array.from(teamsCards).forEach((card, index) => {
                    textToCopy += `Отбор ${index + 1}:\n`;
                    const players = card.querySelectorAll('li span');
                    players.forEach(p => {
                        textToCopy += `- ${p.innerText}\n`;
                    });
                    textToCopy += `\n`;
                });

                try {
                    // Fallback clipboard method using execCommand for better iFrame support
                    const textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    // Move textarea out of viewport
                    textArea.style.position = "absolute";
                    textArea.style.left = "-999999px";
                    document.body.prepend(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                    
                    const originalText = copyBtn.innerHTML;
                    copyBtn.innerHTML = `<svg class="w-4 h-4 mr-1 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Копирано!`;
                    setTimeout(() => {
                        copyBtn.innerHTML = originalText;
                    }, 2000);
                } catch (err) {
                    showMessage("Неуспешно копиране. Моля, копирайте ръчно.");
                }
            });

            // Sync Inputs (Optional UX Enhancement)
            // If user types in "numTeams", we clear "playersPerTeam" to avoid confusion, and vice versa.
            numTeamsInput.addEventListener('input', () => {
                if(numTeamsInput.value) playersPerTeamInput.value = '';
            });
            playersPerTeamInput.addEventListener('input', () => {
                if(playersPerTeamInput.value) numTeamsInput.value = '';
            });

        });
    </script>
</body>
</html>
