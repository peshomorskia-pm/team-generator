name: Supabase Migrations CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Push Database Schema
        run: |
          ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))")
          DB_URL="postgresql://postgres.ctmusfnyftdrjopumwcw:${ENCODED_PASSWORD}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres"
          supabase migration repair --status applied 20261002000000 20261003000000 20261003010000 20261003120000 20261003140000 --db-url "$DB_URL"
          supabase db push --db-url "$DB_URL"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
